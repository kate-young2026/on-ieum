<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획 대시보드 · 온-이음</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='16' r='5' fill='%23B5531F'/%3E%3Ccircle cx='25' cy='16' r='5' fill='%2347704F'/%3E%3Cpath d='M12 16h8' stroke='%23B5531F' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/room.css">
<style>
  .db{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  .db-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .db-top h1{font:700 28px var(--font-display);margin:0;display:flex;align-items:center}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .kpi b{display:block;font:700 30px/1.1 var(--font-display)}
  .kpi span{font-size:12px;color:var(--ink-muted)}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}
  .bar i{display:block;height:100%}
  .spaces{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .sp-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:5px solid var(--line)}
  .sp-card h2{font:700 19px var(--font-display);margin:0 0 2px;display:flex;justify-content:space-between;align-items:baseline}
  .sp-card ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
  .sp-card li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:14px;align-items:start}
  .sp-card li small{grid-column:2;color:var(--ink-muted);font-size:12px}
  .st{font:500 11px var(--font-sans);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .st.done{background:var(--garden);color:var(--on-accent)}.st.doing{background:var(--ember);color:var(--on-accent)}.st.plan{background:var(--line);color:var(--ink)}
  .tl{list-style:none;padding:0;margin:0;display:grid;gap:0}
  .tl li{display:grid;grid-template-columns:70px 18px 1fr;gap:10px;align-items:center;padding:8px 0}
  .tl .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:var(--paper)}
  .tl li.done .dot{background:var(--garden);border-color:var(--garden)}.tl li.doing .dot{background:var(--ember);border-color:var(--ember)}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:22px}
  @media (max-width:860px){.two-col{grid-template-columns:1fr}}
  h2.sec{font:700 20px var(--font-display);margin:28px 0 12px}
</style>
</head>
<body class="room-page">
<div class="db">
  <div class="db-top">
    <h1>온<span class="dash" aria-hidden="true"></span>이음 기획 대시보드</h1>
    <span class="chip-s oak" id="ver"></span>
    <span style="flex:1"></span>
    <a class="btn-s" href="index.html">집으로</a>
    <a class="btn-s" href="#" data-theme-toggle>낮/밤</a>
  </div>
  <div class="kpis" id="kpis"></div>
  <h2 class="sec">공간별 진행</h2>
  <div class="spaces" id="spaces"></div>
  <div class="two-col">
    <div class="card-s"><h3>로드맵</h3><ol class="tl" id="tl"></ol></div>
    <div>
      <div class="card-s"><h3>확인 필요</h3><ul id="checks" style="margin:0;padding-left:18px;font-size:14px"></ul></div>
      <div class="card-s"><h3>지키는 것</h3><ul id="rules" style="margin:0;padding-left:18px;font-size:14px"></ul></div>
    </div>
  </div>
  <p class="note-s" style="margin-top:18px">판본·방·로드맵·숫자는 모두 data/plan.json 하나에서 읽어요. 메인 화면도 같은 파일을 읽으니 계획이 바뀌면 그 파일만 고치면 돼요.</p>
</div>
<script src="js/common.js"></script>
<script>
(function () {
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var LABEL = { done: '완료', doing: '진행', plan: '예정' };
  fetch('data/plan.json').then(function (r) { return r.json(); }).then(function (p) {
    var feats = [].concat.apply([], p.spaces.map(function (s) { return s.features; }));
    var c = { done: 0, doing: 0, plan: 0 }; feats.forEach(function (f) { c[f.status]++; });
    var rm = p.roadmap, rmDone = rm.filter(function (r) { return r.status === 'done'; }).length + rm.filter(function (r) { return r.status === 'doing'; }).length * 0.5;
    var pct = Math.round(c.done / feats.length * 100);
    document.getElementById('ver').textContent = p.version + ' · ' + p.updated;
    document.getElementById('kpis').innerHTML =
      '<div class="kpi"><span>공간</span><b>' + p.spaces.length + '</b><span>방 ' + p.house.rooms.length + ' · ' + esc(p.house.metaphor) + '</span></div>' +
      '<div class="kpi"><span>기능 완료</span><b>' + c.done + ' / ' + feats.length + '</b><div class="bar"><i style="width:' + (c.done / feats.length * 100) + '%;background:var(--garden)"></i><i style="width:' + (c.doing / feats.length * 100) + '%;background:var(--ember)"></i></div><span>완료 ' + c.done + ' · 진행 ' + c.doing + ' · 예정 ' + c.plan + '</span></div>' +
      '<div class="kpi"><span>로드맵</span><b>' + Math.round(rmDone / rm.length * 100) + '%</b><span>' + rm.length + '단계 중 ' + rm.filter(function (r) { return r.status === 'done'; }).length + '단계 완료</span></div>' +
      '<div class="kpi"><span>뉴스 브리핑</span><b>' + esc(p.briefing.time) + '</b><span>' + esc(p.briefing.days) + ' · ' + esc(p.briefing.fields.join(' · ')) + '</span></div>' +
      '<div class="kpi"><span>확인 필요</span><b>' + p.checks.length + '</b><span>사람이 직접 확인할 일</span></div>';
    document.getElementById('spaces').innerHTML = p.spaces.map(function (s) {
      var d = s.features.filter(function (f) { return f.status === 'done'; }).length;
      var rn = (s.rooms || []).map(function (id) { var r = p.house.rooms.filter(function (x) { return x.id === id; })[0]; return r ? r.name : id; });
      return '<section class="sp-card" style="border-top-color:var(--' + s.tone + ')"><h2>' + esc(s.name) + '<small class="note-s">' + esc(s.floor) + ' · ' + d + '/' + s.features.length + '</small></h2>' +
        (rn.length ? '<p class="note-s" style="margin:2px 0 0">방: ' + esc(rn.join(' · ')) + '</p>' : '') + '<ul>' +
        s.features.map(function (f) {
          var name = f.link ? '<a href="' + esc(f.link) + '">' + esc(f.name) + '</a>' : esc(f.name);
          return '<li><span class="st ' + f.status + '">' + LABEL[f.status] + '</span><span>' + name + '</span>' + (f.note ? '<small>' + esc(f.note) + '</small>' : '') + '</li>';
        }).join('') + '</ul></section>';
    }).join('');
    document.getElementById('tl').innerHTML = rm.map(function (r) { return '<li class="' + r.status + '"><span class="note-s">' + esc(r.week) + '</span><span class="dot"></span><span>' + esc(r.title) + ' <span class="st ' + r.status + '">' + LABEL[r.status] + '</span></span></li>'; }).join('');
    document.getElementById('checks').innerHTML = p.checks.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
    document.getElementById('rules').innerHTML = p.rules.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
  }).catch(function () { document.getElementById('kpis').innerHTML = '<div class="card-s">plan.json을 불러오지 못했어요. 웹 서버에서 열어 주세요.</div>'; });
})();
</script>
</body>
</html>
