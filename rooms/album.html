<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>가족 앨범북 · 온-이음</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='16' r='5' fill='%23B5531F'/%3E%3Ccircle cx='25' cy='16' r='5' fill='%2347704F'/%3E%3Cpath d='M12 16h8' stroke='%23B5531F' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../css/room.css">
<link rel="stylesheet" href="../css/album.css">
</head>
<body class="room-page">

<!-- 잠금 화면: 비밀번호를 맞혀야 이 기기에 저장된 사진을 엽니다 -->
<section class="al-gate" id="gate" aria-labelledby="gateTitle">
  <form class="al-gate-card" id="gateForm" autocomplete="off">
    <div class="al-gate-lock" aria-hidden="true"><i></i></div>
    <h1 id="gateTitle">가족 앨범북</h1>
    <p class="muted">가족만 보는 방이에요. 비밀번호를 입력해 주세요.</p>
    <div class="al-pin" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" aria-label="비밀번호" placeholder="비밀번호" required>
    <button class="btn-s pri" type="submit">열기</button>
    <p class="al-gate-err" id="gateErr" role="alert"></p>
    <a class="note-s" href="../index.html">← 집으로 돌아가기</a>
  </form>
</section>

<div class="r-app" id="albumApp" hidden>
  <nav class="r-rail" aria-label="방">
    <a class="home" href="../index.html" title="집으로">온-<br>이음</a>
    <a href="../dashboard.html">대시<br>보드</a>
    <a href="coding.html">코딩</a>
    <a href="classroom.html">교실</a>
    <a href="escape.html">방<br>탈출</a>
    <a href="locker.html">사물함</a>
    <a href="portfolio.html">서재</a>
    <a href="album.html" class="on" aria-current="page">앨범</a>
    <span class="grow"></span>
    <a href="#" data-theme-toggle title="낮/밤">낮밤</a>
  </nav>

  <aside class="r-list">
    <header><h1>가족 앨범북</h1><p class="sub">사진 DB → 고른 사진만 → 앨범북</p></header>
    <div class="tabs" style="padding:0 14px 6px"><button class="btn-s pri" id="newAlbum">+ 새 앨범</button></div>
    <ul class="r-items" id="albumList"></ul>
    <footer class="al-foot">
      <span class="note-s" id="dbCount"></span>
      <div class="tabs">
        <button class="btn-s" id="backupBtn" title="사진과 앨범을 파일 하나로 저장">백업 저장</button>
        <label class="btn-s" title="백업 파일에서 불러오기">불러오기<input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
        <button class="btn-s" id="lockBtn">잠그기</button>
      </div>
    </footer>
  </aside>

  <main class="r-main">
    <header>
      <div class="tabs" role="tablist">
        <button class="btn-s on" data-tab="db" role="tab">① 사진 DB</button>
        <button class="btn-s" data-tab="make" role="tab">② 앨범 만들기</button>
        <button class="btn-s" data-tab="book" role="tab">③ 앨범북</button>
      </div>
      <span class="sp"></span>
      <span class="note-s" id="selInfo"></span>
    </header>
    <div class="r-body" id="stage"></div>
  </main>

  <aside class="r-side">
    <header><b id="sideTitle">도움말</b></header>
    <div class="r-body" id="side"></div>
  </aside>
</div>

<div id="printBook" class="al-print" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="../js/common.js"></script>
<script src="../js/album.js"></script>
</body>
</html>
